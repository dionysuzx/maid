[package]
name = "maid"
version = "0.1.0"
edition = "2024"
description = "A small polling bot runner that runs local Codex on GitHub PR mentions."
license = "MIT"
repository = "https://github.com/dionysuzx/maid"

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.88"
base64 = "0.22.1"
dirs = "6.0.0"
fs2 = "0.4.3"
regex = "1.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
