# Required.
bot_login = "maid-bot"
master_accounts = ["dionysuzx"]

# Optional. Defaults to master_accounts when omitted.
auto_review_accounts = ["dionysuzx"]

# Optional. Empty or omitted disables automatic PR-open reviews.
auto_review_repos = ["dionysuzx/maid"]

# Optional. Empty or omitted disables automatic issue implementation.
# Maid polls open issues in these repositories that have auto_implement_label.
# auto_implement_accounts defaults to master_accounts when omitted.
auto_implement_accounts = ["dionysuzx"]
auto_implement_repos = ["dionysuzx/maid"]
auto_implement_label = "maid"
auto_implement_window_days = 30

# Optional. Defaults shown below.
bind = "127.0.0.1:3000"
poll_seconds = 20
cache_dir = "~/.maid/cache"
codex_bin = "codex"

# Optional. Omitted by default for no task limit. Set to 0 to pause new starts.
# task_limit_per_24h = 5

# Optional. Leave omitted unless you need to pin api.github.com.
# github_api_ip = "127.0.0.1"

# Optional. Defaults to the bot account and bot-token git/commit behavior.
# Use host modes when the machine's git config, SSH credentials, and signing
# setup should author, sign, and push issue implementation PRs.
[implementation_actor]
login = "dionysuzx"
git_auth = "host"
commit_identity = "host"
