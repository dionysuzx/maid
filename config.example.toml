# Required.
bot_login = "maid-bot"
master_accounts = ["your-name"]

# Optional. Defaults to master_accounts when omitted.
auto_review_accounts = ["your-name"]

# Optional. Empty or omitted disables automatic PR-open reviews.
auto_review_repos = ["your-name/maid"]

# Optional. Defaults shown below.
git_dir = "~/.maid/git"
codex_bin = "codex"
max_concurrent_requests = 1

# Optional. This is the one global GitHub REST request-rate knob. Every GitHub
# API call Maid makes is paced through this budget, including concurrent tasks.
github_api_requests_per_hour = 1200

# Required. These values are passed to Codex.
codex_model = "gpt-5.5"
codex_reasoning_effort = "high"

# Optional. Omitted by default for no task limit. Set to 0 to pause new starts.
# task_limit_per_24h = 5

# Optional. Leave omitted unless you need to pin api.github.com.
# github_api_ip = "127.0.0.1"

# Required. These templates are the full prompts Maid sends to Codex.
# Supported mention placeholders:
# {{mention_url}}, {{pr_url}}, {{raw_body}}, {{cleaned_text}}
# Supported pull_request_opened placeholders:
# {{pr_url}}, {{author}}
# Supported operator_mention placeholders:
# {{bot_login}}, {{trigger_author}}, {{mention_url}}, {{pr_url}},
# {{raw_body}}, {{request_text}}, {{operator_trigger}}
[codex_prompts]
mention = """
You are responding to a GitHub pull request mention.

Inspect the worktree in your current working directory and answer the request.
Return only the GitHub comment body to post. Do not include tool logs or wrappers.

Mention URL:
{{mention_url}}

Pull request URL:
{{pr_url}}

Raw mention body:
{{raw_body}}

Cleaned request text:
{{cleaned_text}}
"""
pull_request_opened = """
You are responding automatically to a GitHub pull request opened by a trusted account.

Inspect the worktree in your current working directory and review the pull request.
Return only the GitHub comment body to post. Do not include tool logs or wrappers.

Pull request URL:
{{pr_url}}

Opened by:
{{author}}

Review request:
please review
"""
operator_mention = """
You are handling a trusted Maid operator request.

You may use git, gh, and local tools to complete the request, including editing files, committing, pushing, or opening pull requests when the request calls for it.
Do not post GitHub comments or reactions yourself. Maid will post your final status back to the pull request and mark the triggering comment handled after you finish.

Context:
- Bot login: {{bot_login}}
- Trigger author: {{trigger_author}}
- Mention URL: {{mention_url}}
- Pull request URL: {{pr_url}}

Operator request:
{{request_text}}

When finished, return a concise final status for Maid to post back to the pull request.
"""
