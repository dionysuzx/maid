# Required.
bot_login = "maid-bot"
master_accounts = ["your-name"]

# Optional. Defaults to master_accounts when omitted.
auto_review_accounts = ["your-name"]

# Optional. Empty or omitted disables automatic PR-open reviews.
auto_review_repos = []

# Optional. Empty or omitted disables automatic issue implementation.
# Maid polls open issues in these repositories that have auto_implement_label.
# auto_implement_accounts defaults to master_accounts when omitted.
# auto_implement_accounts = ["your-name"]
# auto_implement_repos = ["your-name/maid"]
# auto_implement_label = "maid"
# auto_implement_window_days = 30

# Optional. Defaults shown below.
poll_seconds = 20
cache_dir = "~/.maid/cache"
codex_bin = "codex"

# Optional. Omit these to let Codex use its own config defaults.
codex_model = "gpt-5.5"
codex_reasoning_effort = "high"

# Optional. Omitted by default for no task limit. Set to 0 to pause new starts.
# task_limit_per_24h = 5

# Optional. Leave omitted unless you need to pin api.github.com.
# github_api_ip = "127.0.0.1"

# Optional. Defaults to the bot account and bot-token git/commit behavior.
# Use host modes when the machine's git config, SSH credentials, and signing
# setup should author, sign, and push issue implementation PRs.
# [implementation_actor]
# login = "your-name"
# git_auth = "host"
# commit_identity = "host"

# Optional. Checked only when commit_identity = "host".
# Maid reads the effective git config from the prepared checkout before running
# Codex and only verifies fields configured here.
# [implementation_actor.expected_git_identity]
# name = "Your Name"
# email = "your-name@users.noreply.github.com"
# gpgsign = true
# gpg_format = "ssh"

# Required. These templates are the full prompts Maid sends to Codex.
# Supported mention placeholders:
# {{mention_url}}, {{pr_url}}, {{raw_body}}, {{cleaned_text}}
# Supported pull_request_opened placeholders:
# {{pr_url}}, {{author}}
# Supported issue_implementation placeholders:
# {{issue_url}}, {{branch}}, {{title}}, {{body}}
[codex_prompts]
mention = """
You are responding to a GitHub pull request mention.

Inspect the checkout in your current working directory and answer the request.
Return only the GitHub comment body to post. Do not include tool logs or wrappers.

Mention URL:
{{mention_url}}

Pull request URL:
{{pr_url}}

Raw mention body:
{{raw_body}}

Cleaned request text:
{{cleaned_text}}
"""
pull_request_opened = """
You are responding automatically to a GitHub pull request opened by a trusted account.

Inspect the checkout in your current working directory and review the pull request.
Return only the GitHub comment body to post. Do not include tool logs or wrappers.

Pull request URL:
{{pr_url}}

Opened by:
{{author}}

Review request:
please review
"""
issue_implementation = """
You are implementing a GitHub issue from a trusted label trigger.

Inspect the checkout in your current working directory, make the smallest code change that correctly implements the issue, and run the relevant checks when practical.
Leave your changes in the working tree. Do not commit, push, create branches, or open pull requests.
Return only a concise pull request body describing what changed and what you checked. Do not include tool logs or wrappers.

Issue URL:
{{issue_url}}

Branch Maid will publish:
{{branch}}

Issue title:
{{title}}

Issue body:
{{body}}
"""
