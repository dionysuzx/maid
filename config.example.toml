# Required.
bot_login = "maid-bot"
# Numeric IDs are the authority boundary; login is only a display/discovery hint.
# Find an ID with: gh api users/your-name --jq .id. Zero is rejected.
master_accounts = [{ login = "your-name", id = 0 }]

# Optional. Defaults to master_accounts when omitted.
auto_review_accounts = ["your-name"]

# Optional. Empty or omitted disables automatic PR-open reviews.
auto_review_repos = ["your-name/maid"]

# Optional. Reviews every open PR authored by these accounts when its base
# repository is public, regardless of repository. Accounts must also appear in
# master_accounts. Empty or omitted disables cross-repository discovery.
auto_review_public_accounts = ["your-name"]

# Optional. Defaults shown below.
git_dir = "~/.maid/git"
# Dedicated Codex auth directory. Run `just worker-login` before starting Maid.
# It is mounted read-only into the disposable worker;
# Codex can authenticate from it, while worker shell policy denies reading it.
codex_home = "~/.maid/codex"
max_concurrent_requests = 1

# Optional. This is the one global GitHub REST request-rate knob. Every GitHub
# API call Maid makes is paced through this budget, including concurrent tasks.
github_api_requests_per_hour = 1200

# Optional. How far back each notification poll searches. Defaults to 24 hours.
github_notification_window_hours = 24

# Optional. Prometheus metrics are served at /metrics on this loopback address.
metrics_bind_address = "127.0.0.1:9464"

# Required. These values are passed to Codex.
codex_model = "gpt-5.5"
codex_reasoning_effort = "high"

# Optional. Omitted by default for no task limit. Set to 0 to pause new starts.
# task_limit_per_24h = 5

# Optional. Leave omitted unless you need to pin api.github.com.
# github_api_ip = "127.0.0.1"

# Required. These templates are the full prompts Maid sends to Codex.
# Supported mention placeholders:
# {{mention_url}}, {{target_url}}, {{pr_url}}, {{raw_body}}, {{cleaned_text}}
# Supported pull_request_opened placeholders:
# {{pr_url}}, {{author}}
[codex_prompts]
mention = """
You are responding to a GitHub mention.

Inspect the worktree in your current working directory and answer the request.
Return only the GitHub comment body to post. Do not include tool logs or wrappers.

Mention URL:
{{mention_url}}

Target URL:
{{target_url}}

Raw mention body:
{{raw_body}}

Cleaned request text:
{{cleaned_text}}
"""
pull_request_opened = """
You are responding automatically to a GitHub pull request opened by a trusted account.

Inspect the worktree in your current working directory and review the pull request.
Return only the GitHub comment body to post. Do not include tool logs or wrappers.

Pull request URL:
{{pr_url}}

Opened by:
{{author}}

Review request:
please review
"""
